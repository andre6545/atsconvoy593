<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS ECUADOR SERVER (+593) | Dashboard Telemetría</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-dark: #070a11;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --panel-border: rgba(255, 255, 255, 0.1);
            
            /* Colores Bandera Ecuador */
            --ec-yellow: #ffda1a;
            --ec-blue: #034ea2;
            --ec-red: #ed1c24;

            --accent-cyan: #06b6d4;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --status-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(3, 78, 162, 0.25) 0%, transparent 70%),
                radial-gradient(circle at 100% 100%, rgba(237, 28, 36, 0.15) 0%, transparent 50%);
        }

        .ec-stripe {
            height: 5px;
            width: 100%;
            background: linear-gradient(90deg, var(--ec-yellow) 50%, var(--ec-blue) 50% 75%, var(--ec-red) 75%);
            position: fixed;
            top: 0;
            z-index: 1001;
            box-shadow: 0 0 12px rgba(255, 218, 26, 0.5);
        }

        header {
            margin-top: 5px;
            background: rgba(10, 15, 26, 0.9);
            border-bottom: 1px solid var(--panel-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(15px);
            position: sticky;
            top: 5px;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brand-icon {
            background: linear-gradient(135deg, var(--ec-yellow), var(--ec-red));
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 218, 26, 0.4);
        }

        .brand-title h1 {
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, var(--ec-yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-title p {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--status-green);
        }

        .status-pill.offline {
            background: rgba(237, 28, 36, 0.15);
            border-color: rgba(237, 28, 36, 0.4);
            color: var(--ec-red);
        }

        .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: currentColor;
            box-shadow: 0 0 10px currentColor;
            animation: blink 1.5s infinite;
        }

        @keyframes blink { 50% { opacity: 0.4; } }

        .container {
            max-width: 1300px;
            width: 95%;
            margin: 2rem auto;
            display: grid;
            gap: 2rem;
        }

        .metrics-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.25rem;
        }

        .metric-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: 700;
        }

        .metric-value {
            font-size: 1.4rem;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-primary);
        }

        .panel-box {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            padding: 1.8rem;
            backdrop-filter: blur(10px);
        }

        .panel-title {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 0.8rem;
        }

        .players-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.2rem;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            transition: transform 0.2s;
        }

        .player-card:hover {
            transform: translateY(-3px);
            border-color: var(--ec-yellow);
        }

        .player-header {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .player-avatar {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid var(--ec-yellow);
        }

        .player-title h4 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .player-title p {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        .player-telemetry {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
            background: rgba(0, 0, 0, 0.25);
            padding: 0.75rem;
            border-radius: 10px;
            font-size: 0.8rem;
        }

        .telemetry-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
        }

        .telemetry-item i {
            color: var(--ec-yellow);
        }

        .telemetry-item span {
            color: var(--text-primary);
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .timer-badge {
            background: rgba(16, 185, 129, 0.15);
            color: var(--status-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            width: fit-content;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
            font-style: italic;
            grid-column: 1 / -1;
        }

        footer {
            margin-top: auto;
            padding: 1.5rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--panel-border);
        }
    </style>
</head>
<body>

    <div class="ec-stripe"></div>

    <header>
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-truck-front"></i></div>
            <div class="brand-title">
                <h1 id="serverNameHeader">ATS ECUADOR SERVER</h1>
                <p>🇪🇨 RUTA 593 | CONVOY HUB</p>
            </div>
        </div>
        <div id="serverStatusPill" class="status-pill">
            <div class="indicator"></div>
            <span id="statusText">Cargando...</span>
        </div>
    </header>

    <div class="container">
        <div class="metrics-row">
            <div class="metric-card">
                <div class="metric-header">
                    <span>ID de Sesión</span>
                    <i class="fa-solid fa-fingerprint" style="color: var(--ec-yellow)"></i>
                </div>
                <div class="metric-value" id="valSessionId">--</div>
            </div>

            <div class="metric-card">
                <div class="metric-header">
                    <span>Jugadores</span>
                    <i class="fa-solid fa-users" style="color: var(--accent-cyan)"></i>
                </div>
                <div class="metric-value" id="valPlayers">0 / 0</div>
            </div>

            <div class="metric-card">
                <div class="metric-header">
                    <span>Versión de ATS</span>
                    <i class="fa-solid fa-code-branch" style="color: var(--ec-red)"></i>
                </div>
                <div class="metric-value" id="valVersion">--</div>
            </div>

            <div class="metric-card">
                <div class="metric-header">
                    <span>Uptime Servidor</span>
                    <i class="fa-solid fa-stopwatch" style="color: var(--status-green)"></i>
                </div>
                <div class="metric-value" id="valUptime">--</div>
            </div>
        </div>

        <div class="panel-box">
            <div class="panel-title">
                <i class="fa-brands fa-steam" style="color: var(--accent-cyan)"></i>
                Conductores en Ruta (Telemetría Activa)
            </div>
            <div class="players-container" id="playersList">
                <div class="empty-state">Consultando lista de conductores...</div>
            </div>
        </div>
    </div>

    <footer>
        Sincronizado con API Server ATS (+593)
    </footer>

    <script>
        const playerTimers = new Map();

        function formatUptime(seconds) {
            if (!seconds || isNaN(seconds)) return '--';
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            return hrs > 0 ? `${hrs}h ${mins}m` : `${mins}m`;
        }

        function formatDuration(startTime) {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const hrs = Math.floor(elapsed / 3600);
            const mins = Math.floor((elapsed % 3600) / 60);
            const secs = elapsed % 60;
            return hrs > 0 ? `${hrs}h ${mins}m` : `${mins}m ${secs}s`;
        }

        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                const statusPill = document.getElementById('serverStatusPill');
                const statusText = document.getElementById('statusText');

                if (response.ok && data.serverRunning) {
                    statusPill.classList.remove('offline');
                    statusText.textContent = 'En Línea';

                    document.getElementById('serverNameHeader').textContent = data.serverName || 'ATS ECUADOR SERVER';
                    document.getElementById('valSessionId').textContent = data.sessionID || 'N/D';
                    
                    const players = data.connectedPlayers || [];
                    const slots = data.slots || 32;
                    document.getElementById('valPlayers').textContent = `${players.length} / ${slots}`;
                    document.getElementById('valVersion').textContent = data.game_version || '--';
                    document.getElementById('valUptime').textContent = formatUptime(data.apiUptime);

                    const playersList = document.getElementById('playersList');

                    if (players.length > 0) {
                        playersList.innerHTML = '';
                        const activeIds = new Set();

                        players.forEach(p => {
                            const pId = p.id || p.client_id || p.username;
                            activeIds.add(pId);

                            if (!playerTimers.has(pId)) {
                                playerTimers.set(pId, p.connectedSince || Date.now());
                            }

                            const username = p.username || 'Conductor';
                            const truckModel = p.truck || 'Kenworth T680';
                            const currentCity = p.city || 'Quito (Ruta 593)';
                            const avatarUrl = 'https://avatars.steamstatic.com/fef49e7fa7e1997310d705b2a6158ff8dc1cdfeb_full.jpg';

                            const item = document.createElement('div');
                            item.className = 'player-card';
                            item.innerHTML = `
                                <div class="player-header">
                                    <img src="${avatarUrl}" class="player-avatar" alt="Avatar">
                                    <div class="player-title">
                                        <h4>${username}</h4>
                                        <p>Client ID: ${p.id || 'N/A'}</p>
                                    </div>
                                </div>
                                <div class="player-telemetry">
                                    <div class="telemetry-item">
                                        <i class="fa-solid fa-truck"></i>
                                        <span title="${truckModel}">${truckModel}</span>
                                    </div>
                                    <div class="telemetry-item">
                                        <i class="fa-solid fa-location-dot"></i>
                                        <span title="${currentCity}">${currentCity}</span>
                                    </div>
                                </div>
                                <div class="timer-badge">
                                    <i class="fa-solid fa-clock"></i>
                                    <span id="timer-${pId}">${formatDuration(playerTimers.get(pId))}</span>
                                </div>
                            `;
                            playersList.appendChild(item);
                        });

                        // Limpiar jugadores desconectados del Map
                        for (const key of playerTimers.keys()) {
                            if (!activeIds.has(key)) playerTimers.delete(key);
                        }

                    } else {
                        playerTimers.clear();
                        playersList.innerHTML = '<div class="empty-state">No hay conductores en ruta actualmente.</div>';
                    }

                } else {
                    throw new Error(data.error || 'Servidor no disponible');
                }

            } catch (err) {
                const statusPill = document.getElementById('serverStatusPill');
                statusPill.classList.add('offline');
                document.getElementById('statusText').textContent = 'Fuera de Línea';
                document.getElementById('valSessionId').textContent = 'Sin Conexión';
                document.getElementById('valPlayers').textContent = '0 / 0';
                document.getElementById('valVersion').textContent = '--';
                document.getElementById('valUptime').textContent = '--';
                document.getElementById('playersList').innerHTML = '<div class="empty-state">El servidor no responde o está apagado.</div>';
            }
        }

        // Bucle para actualizar temporizadores cada segundo
        setInterval(() => {
            playerTimers.forEach((startTime, pId) => {
                const timerEl = document.getElementById(`timer-${pId}`);
                if (timerEl) {
                    timerEl.textContent = formatDuration(startTime);
                }
            });
        }, 1000);

        updateStatus();
        setInterval(updateStatus, 10000);
    </script>
</body>
</html>
