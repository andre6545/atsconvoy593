<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS Monitor</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b0f14;
            --panel: #111821;
            --border: #24303d;
            --text: #eef4f8;
            --muted: #9eacb8;
            --green: #32d583;
            --yellow: #f5c451;
            --orange: #f79009;
            --red: #f04438;
            --blue: #4ea1ff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .wrap { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 48px; }
        header { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; margin-bottom:22px; }
        h1 { margin:0 0 6px; font-size:clamp(1.7rem, 4vw, 2.4rem); }
        .subtitle { margin:0; color:var(--muted); }
        .status-pill { display:inline-flex; align-items:center; gap:8px; padding:9px 12px; border:1px solid var(--border); border-radius:999px; background:var(--panel); font-weight:700; }
        .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); }
        .online .dot { background:var(--green); }
        .offline .dot { background:var(--red); }
        .timeout .dot { background:var(--yellow); }
        .api-error .dot { background:var(--orange); }
        .grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; }
        .card { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:18px; }
        .label { color:var(--muted); font-size:.86rem; margin-bottom:8px; }
        .value { font-size:1.25rem; font-weight:800; word-break:break-word; }
        .wide { grid-column:span 2; }
        .events { margin-top:14px; }
        .events h2 { margin:0 0 12px; font-size:1.1rem; }
        .event { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
        .event:last-child { border-bottom:0; }
        .event-time { color:var(--muted); min-width:58px; font-variant-numeric:tabular-nums; }
        .event-message { flex:1; }
        .event-type { color:var(--blue); font-size:.76rem; text-transform:uppercase; letter-spacing:.06em; }
        .players { display:grid; gap:8px; margin-top:10px; }
        .player { display:flex; justify-content:space-between; gap:12px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; }
        .muted { color:var(--muted); }
        .error { color:var(--orange); }
        .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
        @media (max-width: 760px) {
            header { flex-direction:column; }
            .grid { grid-template-columns:1fr 1fr; }
            .wide { grid-column:span 2; }
        }
        @media (max-width: 480px) {
            .wrap { width:min(100% - 20px, 1100px); padding-top:18px; }
            .grid { grid-template-columns:1fr; }
            .wide { grid-column:span 1; }
            .event { flex-direction:column; gap:4px; }
        }
    </style>
</head>
<body>
<main class="wrap">
    <header>
        <div>
            <h1 id="serverName">ATS Monitor</h1>
            <p class="subtitle">Monitor de estado y actividad del servidor</p>
        </div>
        <div id="statusPill" class="status-pill" role="status" aria-live="polite">
            <span class="dot" aria-hidden="true"></span>
            <span id="statusText">Comprobando…</span>
        </div>
    </header>

    <section class="grid" aria-label="Estado del servidor">
        <article class="card">
            <div class="label">Estado</div>
            <div class="value" id="serverState">Comprobando…</div>
        </article>
        <article class="card">
            <div class="label">Jugadores</div>
            <div class="value" id="playerCount">—</div>
        </article>
        <article class="card">
            <div class="label">Slots</div>
            <div class="value" id="slotCount">—</div>
        </article>
        <article class="card">
            <div class="label">Versión</div>
            <div class="value" id="gameVersion">—</div>
        </article>
        <article class="card wide">
            <div class="label">Session ID</div>
            <div class="value" id="sessionId">—</div>
        </article>
        <article class="card">
            <div class="label">Uptime de API</div>
            <div class="value" id="apiUptime">—</div>
        </article>
        <article class="card wide">
            <div class="label">Jugadores conectados</div>
            <div id="players" class="players">
                <div class="muted">Sin datos.</div>
            </div>
        </article>
        <article class="card wide events">
            <h2>Historial reciente</h2>
            <div id="events" aria-live="polite"></div>
        </article>
    </section>
</main>

<script>
(() => {
    'use strict';

    const POLL_INTERVAL_MS = 10000;
    const REQUEST_TIMEOUT_MS = 8000;
    let isUpdating = false;
    let countdown = 10;

    const $ = (id) => document.getElementById(id);

    const statusPill = $('statusPill');
    const statusText = $('statusText');
    const serverState = $('serverState');
    const serverName = $('serverName');
    const playerCount = $('playerCount');
    const slotCount = $('slotCount');
    const gameVersion = $('gameVersion');
    const sessionId = $('sessionId');
    const apiUptime = $('apiUptime');
    const players = $('players');
    const events = $('events');

    function formatUptime(totalSeconds) {
        const seconds = Math.max(0, Number(totalSeconds) || 0);
        const days = Math.floor(seconds / 86400);
        const hours = Math.floor((seconds % 86400) / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const secs = seconds % 60;
        const parts = [];
        if (days) parts.push(`${days}d`);
        if (hours || days) parts.push(`${hours}h`);
        if (minutes || hours || days) parts.push(`${minutes}m`);
        parts.push(`${secs}s`);
        return parts.join(' ');
    }

    function setStatus(state, label) {
        statusPill.classList.remove('online', 'offline', 'timeout', 'api-error');
        statusPill.classList.add(state);
        statusText.textContent = label;
        serverState.textContent = label;
    }

    function safeText(value, fallback = '—') {
        return value === null || value === undefined ? fallback : String(value);
    }

    function renderPlayers(list) {
        players.replaceChildren();

        if (!Array.isArray(list) || list.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'muted';
            empty.textContent = 'No hay jugadores conectados.';
            players.appendChild(empty);
            return;
        }

        const fragment = document.createDocumentFragment();

        for (const player of list) {
            const item = document.createElement('div');
            item.className = 'player';

            const name = document.createElement('strong');
            name.textContent = safeText(player?.username, 'Conductor');

            const id = document.createElement('span');
            id.className = 'muted';
            id.textContent = safeText(player?.client_id, '');

            item.append(name, id);
            fragment.appendChild(item);
        }

        players.appendChild(fragment);
    }

    function renderEvents(list) {
        events.replaceChildren();

        if (!Array.isArray(list) || list.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'muted';
            empty.textContent = 'No hay eventos registrados.';
            events.appendChild(empty);
            return;
        }

        const fragment = document.createDocumentFragment();

        for (const event of list) {
            const item = document.createElement('div');
            item.className = 'event';

            const time = document.createElement('span');
            time.className = 'event-time';
            time.textContent = safeText(event?.time, '--:--');

            const content = document.createElement('div');

            const type = document.createElement('div');
            type.className = 'event-type';
            type.textContent = safeText(event?.type, 'system');

            const message = document.createElement('div');
            message.className = 'event-message';
            message.textContent = safeText(event?.message, '');

            content.append(type, message);
            item.append(time, content);
            fragment.appendChild(item);
        }

        events.appendChild(fragment);
    }

    async function updateStatus() {
        if (isUpdating) return;
        isUpdating = true;

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

        try {
            const response = await fetch('/api/status', {
                method: 'GET',
                cache: 'no-store',
                headers: { 'Accept': 'application/json' },
                signal: controller.signal
            });

            if (!response.ok) {
                throw new Error(`HTTP_${response.status}`);
            }

            const data = await response.json();

            serverName.textContent = safeText(data.serverName, 'ATS Monitor');
            playerCount.textContent = Array.isArray(data.connectedPlayers) ? data.connectedPlayers.length : 0;
            slotCount.textContent = safeText(data.slots, '—');
            gameVersion.textContent = safeText(data.game_version, '—');
            sessionId.textContent = safeText(data.sessionID, '—');
            apiUptime.textContent = formatUptime(data.apiUptime);

            const state = safeText(data.status, data.serverRunning ? 'online' : 'offline');

            if (state === 'online') {
                setStatus('online', 'En Línea');
            } else if (state === 'timeout') {
                setStatus('timeout', 'Timeout');
            } else if (state === 'api_error') {
                setStatus('api-error', 'API con problemas');
            } else {
                setStatus('offline', 'Servidor ATS fuera de línea');
            }

            renderPlayers(data.connectedPlayers ?? []);
            renderEvents(data.events ?? []);
        } catch (error) {
            if (error?.name === 'AbortError') {
                setStatus('timeout', 'Timeout');
            } else {
                setStatus('api-error', 'API con problemas');
            }
            serverState.classList.add('error');
        } finally {
            clearTimeout(timeoutId);
            isUpdating = false;
        }
    }

    updateStatus();

    setInterval(() => {
        countdown = 10;
        updateStatus();
    }, POLL_INTERVAL_MS);
})();
</script>
</body>
</html>
