<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS Server Status | ECUADOR SERVER</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-dark: #080c14;
            --panel-bg: #0f172a;
            --panel-border: #1e293b;
            --accent-red: #ef4444;
            --accent-gold: #f59e0b;
            --accent-cyan: #06b6d4;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --status-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 2px solid rgba(239, 68, 68, 0.4);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brand-icon {
            background: linear-gradient(135deg, var(--accent-red), var(--accent-gold));
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #fff;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }

        .brand-title h1 {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #fff;
        }

        .brand-title p {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--status-green);
        }

        .status-pill.offline {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--accent-red);
        }

        .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: currentColor;
            box-shadow: 0 0 10px currentColor;
        }

        .container {
            max-width: 1200px;
            width: 95%;
            margin: 2rem auto;
            display: grid;
            gap: 1.5rem;
        }

        .metrics-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.25rem;
        }

        .metric-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 1.25rem 1.5rem;
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: 600;
        }

        .metric-value {
            font-size: 1.3rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-primary);
            word-break: break-all;
        }

        .panel-box {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 1.5rem;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .players-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .player-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 0.8rem 1rem;
        }

        .player-avatar {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid var(--panel-border);
        }

        .player-details h4 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .player-details p {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-secondary);
            font-style: italic;
            width: 100%;
            grid-column: 1 / -1;
        }

        footer {
            margin-top: auto;
            padding: 1.5rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--panel-border);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-truck-monster"></i></div>
            <div class="brand-title">
                <h1 id="serverNameHeader">American Truck Simulator</h1>
                <p>Estado del Servidor Dedicado</p>
            </div>
        </div>
        <div id="serverStatusPill" class="status-pill">
            <div class="indicator"></div>
            <span id="statusText">Cargando...</span>
        </div>
    </header>

    <div class="container">
        <!-- Métricas Principales de la API -->
        <div class="metrics-row">
            <div class="metric-card">
                <div class="metric-header">
                    <span>ID de Sesión (Server ID)</span>
                    <i class="fa-solid fa-fingerprint" style="color: var(--accent-gold)"></i>
                </div>
                <div class="metric-value" id="valSessionId">--</div>
            </div>

            <div class="metric-card">
                <div class="metric-header">
                    <span>Jugadores Conectados</span>
                    <i class="fa-solid fa-users" style="color: var(--accent-cyan)"></i>
                </div>
                <div class="metric-value" id="valPlayers">0 / 0</div>
            </div>

            <div class="metric-card">
                <div class="metric-header">
                    <span>Versión del Juego</span>
                    <i class="fa-solid fa-code-branch" style="color: var(--accent-red)"></i>
                </div>
                <div class="metric-value" id="valVersion">--</div>
            </div>

            <div class="metric-card">
                <div class="metric-header">
                    <span>Tiempo Activo (Uptime)</span>
                    <i class="fa-solid fa-clock" style="color: var(--status-green)"></i>
                </div>
                <div class="metric-value" id="valUptime">--</div>
            </div>
        </div>

        <!-- Lista de Jugadores con Steam Avatar -->
        <div class="panel-box">
            <div class="panel-title">
                <i class="fa-brands fa-steam" style="color: var(--accent-cyan)"></i>
                Jugadores en Línea
            </div>
            <div class="players-container" id="playersList">
                <div class="empty-state">Consultando la lista de conductores...</div>
            </div>
        </div>
    </div>

    <footer>
        Sincronizado directamente con la API en tiempo real.
    </footer>

    <script>
        function formatUptime(seconds) {
            if (!seconds || isNaN(seconds)) return '--';
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            if (hrs > 0) return `${hrs}h ${mins}m`;
            return `${mins}m`;
        }

        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                const statusPill = document.getElementById('serverStatusPill');
                const statusText = document.getElementById('statusText');

                if (response.ok && data.serverRunning) {
                    statusPill.classList.remove('offline');
                    statusText.textContent = 'En Línea';

                    // Actualizar datos de la API real
                    document.getElementById('serverNameHeader').textContent = data.serverName || 'American Truck Simulator';
                    document.getElementById('valSessionId').textContent = data.sessionID || 'N/D';
                    
                    const players = data.connectedPlayers || [];
                    const slots = data.slots || 32;
                    document.getElementById('valPlayers').textContent = `${players.length} / ${slots}`;
                    
                    document.getElementById('valVersion').textContent = data.game_version || '--';
                    document.getElementById('valUptime').textContent = formatUptime(data.apiUptime);

                    // Renderizar Lista de Jugadores
                    const playersList = document.getElementById('playersList');

                    if (players.length > 0) {
                        playersList.innerHTML = '';
                        players.forEach(p => {
                            const username = p.username || 'Conductor';
                            const clientId = p.client_id ? `Client ID: ${p.client_id}` : 'En Convoy';
                            
                            // Avatar de Steam por defecto o personalizado
                            const avatarUrl = 'https://avatars.steamstatic.com/fef49e7fa7e1997310d705b2a6158ff8dc1cdfeb_full.jpg';

                            const item = document.createElement('div');
                            item.className = 'player-card';
                            item.innerHTML = `
                                <img src="${avatarUrl}" class="player-avatar" alt="Avatar">
                                <div class="player-details">
                                    <h4>${username}</h4>
                                    <p>${clientId}</p>
                                </div>
                            `;
                            playersList.appendChild(item);
                        });
                    } else {
                        playersList.innerHTML = '<div class="empty-state">No hay jugadores conectados en este momento.</div>';
                    }

                } else {
                    throw new Error(data.error || 'Servidor detenido');
                }

            } catch (err) {
                const statusPill = document.getElementById('serverStatusPill');
                statusPill.classList.add('offline');
                document.getElementById('statusText').textContent = 'Fuera de Línea';
                document.getElementById('valSessionId').textContent = 'Sin Conexión';
                document.getElementById('valPlayers').textContent = '0 / 0';
                document.getElementById('valVersion').textContent = '--';
                document.getElementById('valUptime').textContent = '--';
                document.getElementById('playersList').innerHTML = '<div class="empty-state">El servidor no responde o está apagado.</div>';
            }
        }

        updateStatus();
        setInterval(updateStatus, 10000);
    </script>
</body>
</html>
