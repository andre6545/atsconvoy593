<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECUA SERVER +593 | OBS Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #f1b642;
      --gold-glow: rgba(241, 182, 66, 0.4);
      --green: #2ecc71;
      --red: #e74c3c;
      --bg-dark: rgba(12, 16, 24, 0.82);
      --border-color: rgba(241, 182, 66, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    /* Transparencia total para OBS */
    body {
      background: transparent !important;
      font-family: 'Rajdhani', sans-serif;
      color: #ffffff;
      overflow: hidden;
      padding: 20px;
      width: 100vw;
      height: 100vh;
    }

    /* Widget Flotante Compacto */
    .overlay-card {
      width: 320px;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--gold);
      border-radius: 12px;
      padding: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 15px var(--gold-glow);
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cabecera del Widget */
    .overlay-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 0 8px var(--gold-glow);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.4);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 6px var(--red);
    }

    .status-dot.online {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    /* Contador de Jugadores */
    .slots-container {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 10px;
    }

    .slots-label {
      font-size: 0.85rem;
      color: #a0aec0;
      font-weight: 700;
      text-transform: uppercase;
    }

    .slots-count {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      color: #ffffff;
    }

    .slots-count span {
      color: var(--gold);
    }

    /* Barra de Progreso de Ocupación */
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f1b642, #ff8c00);
      box-shadow: 0 0 8px var(--gold);
      transition: width 0.6s ease;
    }

    /* Lista de Conectados */
    .players-list-header {
      font-size: 0.75rem;
      color: #718096;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .players-list {
      list-style: none;
      max-height: 140px;
      overflow-y: hidden;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .player-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.03);
      padding: 4px 8px;
      border-radius: 4px;
      border-left: 2px solid var(--gold);
      animation: fadeIn 0.4s ease;
    }

    .player-icon {
      font-size: 0.75rem;
      color: var(--gold);
    }

    .no-players {
      font-size: 0.8rem;
      color: #718096;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="overlay-card">
    <div class="overlay-header">
      <div class="brand-title">ECUA SERVER +593</div>
      <div class="status-badge">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">Cargando</span>
      </div>
    </div>

    <div class="slots-container">
      <span class="slots-label">Conductores</span>
      <div class="slots-count">
        <span id="playerCount">0</span>/<span id="maxPlayers">16</span>
      </div>
    </div>

    <div class="progress-bar-bg">
      <div id="progressFill" class="progress-bar-fill"></div>
    </div>

    <div class="players-list-header">En Ruta Actual:</div>
    <ul id="playersList" class="players-list">
      <li class="no-players">Obteniendo datos del servidor...</li>
    </ul>
  </div>

  <script>
    async function updateOverlay() {
      try {
        const response = await fetch('/api/status');
        if (!response.ok) throw new Error('Error al conectar');
        
        const data = await response.json();
        
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const playerCount = document.getElementById('playerCount');
        const maxPlayers = document.getElementById('maxPlayers');
        const progressFill = document.getElementById('progressFill');
        const playersList = document.getElementById('playersList');

        if (data.online) {
          statusDot.className = 'status-dot online';
          statusText.textContent = 'En Vivo';
          statusText.style.color = '#2ecc71';
          
          const current = data.players || 0;
          const max = data.maxPlayers || 16;
          
          playerCount.textContent = current;
          maxPlayers.textContent = max;
          
          const percentage = Math.min(100, Math.round((current / max) * 100));
          progressFill.style.width = percentage + '%';

          // Actualizar lista de jugadores
          if (data.playerList && data.playerList.length > 0) {
            playersList.innerHTML = data.playerList.map(name => `
              <li class="player-item">
                <span class="player-icon">🚛</span>
                <span>${escapeHtml(name)}</span>
              </li>
            `).join('');
          } else {
            playersList.innerHTML = '<li class="no-players">No hay conductores en ruta</li>';
          }
        } else {
          statusDot.className = 'status-dot';
          statusText.textContent = 'Offline';
          statusText.style.color = '#e74c3c';
          playerCount.textContent = '0';
          progressFill.style.width = '0%';
          playersList.innerHTML = '<li class="no-players">Servidor no disponible</li>';
        }
      } catch (err) {
        console.error('Error fetching status:', err);
        document.getElementById('statusDot').className = 'status-dot';
        document.getElementById('statusText').textContent = 'Error';
        document.getElementById('statusText').style.color = '#e74c3c';
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Actualizar inmediatamente y luego cada 5 segundos
    updateOverlay();
    setInterval(updateOverlay, 5000);
  </script>
</body>
</html>
